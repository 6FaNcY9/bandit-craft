# The public Minecraft relay (docs/specs/2026-11-10-public-anarchy-world.md, phase 2): TCP only, from the
# internet to the public Velocity over the tailnet. PROXY v2 carries the player's address, so bans and
# logs on the server see real addresses. setup.sh replaces @BACKEND@ with the server's tailnet address.
global
    log /dev/log local0 info
    maxconn 2000
    user haproxy
    group haproxy

defaults
    mode tcp
    log global
    timeout connect 5s
    # The game sends a keep-alive every 15 s; an idle limit below 30 s would cut healthy players.
    timeout client 60s
    timeout server 60s

frontend minecraft
    bind :25565
    bind :::25565 v6only
    # Per address: at most 4 connections at once and 20 new ones in 10 s. A player needs one; a server
    # list pings a few times a minute. Whoever is over the limit is dropped before the server sees them.
    stick-table type ipv6 size 100k expire 60s store conn_cur,conn_rate(10s)
    tcp-request connection track-sc0 src
    tcp-request connection reject if { sc_conn_cur(0) gt 4 }
    tcp-request connection reject if { sc_conn_rate(0) gt 20 }
    default_backend velocity

backend velocity
    # No health check: Velocity refuses a connection without a PROXY header and would log each probe.
    server public @BACKEND@:25565 send-proxy-v2
