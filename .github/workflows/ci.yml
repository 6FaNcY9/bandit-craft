name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nix:
    name: Nix checks (mcbots build with app/test.js)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          extra-conf: |
            substituters = https://cache.nixos.org
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=
      # Same cache as bandit-nix, which builds this flake for the lab.
      # Only main writes: the lab substitutes from this cache.
      - uses: cachix/cachix-action@3ba601ff5bbb07c7220846facfa2cd81eeee15a1 # v16
        with:
          name: github-bandit-nix
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: ${{ github.event_name == 'pull_request' }}
      - run: nix flake check --no-update-lock-file
      - name: Formatting
        run: nix fmt -- --check .

  windows:
    name: Windows scripts (slayer watcher, PC manager, Windows PowerShell 5.1)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Watcher and installer tests
        shell: powershell
        working-directory: tools/slayer
        run: |
          .\test-watch.ps1
          .\test-install.ps1
      - name: PC manager agent and installer tests
        shell: powershell
        working-directory: tools/winpc
        run: |
          .\test-agent.ps1
          .\test-install-agent.ps1
