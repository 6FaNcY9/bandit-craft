<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bots</title>
<style>
  :root { --bg: #121417; --card: #1c1f24; --line: #2a2e35; --text: #e8e8e8; --mut: #9aa1aa; --ok: #4ade80; --warn: #f59e0b; --bad: #ef4444; --acc: #60a5fa; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { position: sticky; top: 0; z-index: 2; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 10px 16px; background: #0d0f12; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 18px; margin: 0 8px 0 0; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--bad); display: inline-block; }
  .dot.on { background: var(--ok); }
  nav { display: flex; gap: 4px; flex: 1; }
  nav button, nav a { background: none; border: 0; color: var(--mut); padding: 6px 10px; border-radius: 6px; font: inherit; cursor: pointer; text-decoration: none; }
  nav .cur { background: var(--card); color: var(--text); }
  main { max-width: 1200px; margin: 0 auto; padding: 16px; display: grid; gap: 16px; }
  section.card, .bot { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
  h2 { font-size: 16px; margin: 0 0 10px; }
  .mut { color: var(--mut); }
  .small { font-size: 13px; }
  .bots { display: grid; gap: 16px; grid-template-columns: 1fr; }
  @media (min-width: 760px) { .bots { grid-template-columns: repeat(2, 1fr); } }
  @media (min-width: 1100px) { .bots { grid-template-columns: repeat(3, 1fr); } }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .between { justify-content: space-between; }
  .badge { font-size: 12px; padding: 1px 8px; border-radius: 999px; background: #2b3340; color: #c9d4e3; }
  .bar { height: 8px; background: #2a2e35; border-radius: 4px; overflow: hidden; flex: 1; min-width: 60px; }
  .bar > i { display: block; height: 100%; background: var(--acc); }
  .bar.hp > i { background: var(--bad); } .bar.food > i { background: var(--warn); } .bar.prog > i { background: var(--ok); }
  .bar.big { height: 14px; border-radius: 7px; }
  .lbl { width: 46px; font-size: 12px; color: var(--mut); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 2px 8px; border-radius: 6px; background: #262a31; }
  .chip.need { background: #3a2a14; } .chip.owner { background: #3b1d1d; }
  button.b { font: inherit; font-size: 14px; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line); background: #262a31; color: var(--text); cursor: pointer; min-height: 40px; }
  button.b:hover { background: #2e333b; }
  button.b.stop { background: #4a1d1d; border-color: #6b2525; }
  button.b.go { background: #1d3a26; border-color: #25603a; }
  .err { color: #fca5a5; }
  .ev { display: grid; grid-template-columns: 52px 56px 1fr; gap: 8px; font-size: 13px; padding: 4px 0; border-bottom: 1px solid #23272d; }
  .ev.fail, .ev.death { color: #fca5a5; } .ev.done { color: #86efac; }
  input.t { font: inherit; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line); background: #0f1114; color: var(--text); }
  #toast { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); background: #2b3340; padding: 8px 14px; border-radius: 8px; display: none; max-width: 92vw; }
  #console { background: #0b0d10; border-radius: 8px; padding: 8px; height: 260px; overflow: auto; font: 12px/1.4 ui-monospace, monospace; white-space: pre-wrap; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <h1>Bots</h1><span class="dot" id="conn" title="Verbindung"></span>
  <nav>
    <button id="tabMain" class="cur">Übersicht</button>
    <button id="tabServer">Server</button>
    <a href="/mehr" title="Die alte Seite: Karte, 3D, Daueraufträge, Agenten, slayer">Mehr ↗</a>
  </nav>
  <button class="b stop" id="stopAll">Alle stopp</button>
</header>

<main id="pageMain">
  <section class="card" id="project" hidden>
    <div class="row between"><h2 id="projTitle">Projekt</h2><span class="mut small" id="projCrew"></span></div>
    <div class="row"><div class="bar big prog"><i id="projBar"></i></div><b id="projNum"></b></div>
    <p class="mut small" id="projPhase"></p>
    <div id="projNeedBox" hidden><div class="small mut">Fehlt noch (die Bots besorgen es):</div><div class="chips" id="projNeed"></div></div>
    <div id="projOwnerBox" hidden><p class="small"><b>Von dir gebraucht</b> (können die Bots nicht beschaffen), in eine Projektkiste:</p><div class="chips" id="projOwner"></div></div>
    <p class="mut small" id="projNote"></p>
  </section>

  <div class="row small mut">Dein Spielername (für „Komm“ und „Folge“): <input class="t" id="me" maxlength="16" size="14"></div>
  <div class="bots" id="bots"></div>

  <section class="card">
    <h2>Ereignisse</h2>
    <div id="events"></div>
  </section>
</main>

<main id="pageServer" hidden>
  <section class="card">
    <div class="row between"><h2>Server</h2><button class="b" id="refresh">Aktualisieren</button></div>
    <p id="srvStatus" class="mut">…</p>
    <div class="chips" id="players"></div>
    <div class="row" style="margin-top:12px">
      <button class="b" data-act="time" data-value="day">Tag</button>
      <button class="b" data-act="time" data-value="night">Nacht</button>
      <button class="b" data-act="weather-clear">Wetter klar</button>
      <button class="b" data-act="save">Speichern</button>
    </div>
  </section>
  <section class="card">
    <h2>Konsole</h2>
    <div id="console"></div>
    <form class="row" id="cmdForm" style="margin-top:8px"><input class="t" id="cmd" placeholder="Befehl, z.B. list" style="flex:1"><button class="b">Senden</button></form>
  </section>
</main>
<div id="toast"></div>

<script>
'use strict';
const $ = (id) => document.getElementById(id);
// Text only through textContent: names, chat and events come from players.
function el(tag, props = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e[k] = v;
    else if (v != null) e.setAttribute(k, v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) e.append(c instanceof Node ? c : String(c));
  return e;
}
let toastTimer;
function say(text, bad) {
  const t = $('toast');
  t.textContent = text;
  t.className = bad ? 'err' : '';
  t.style.display = 'block';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.style.display = 'none'; }, 4000);
}
async function post(url, body) {
  const r = await fetch(url, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || `HTTP ${r.status}`);
  return j;
}
const job = (bots, type, args = {}) => post('/api/job', {bots, type, args, replace: true})
  .then((j) => say(j.unreached?.length ? `${type}: ${j.unreached.join(', ')} gerade nicht erreichbar` : `gesendet: ${type}`), (e) => say(e.message, true));

try { $('me').value = localStorage.getItem('me') || ''; } catch {}
$('me').oninput = () => { try { localStorage.setItem('me', $('me').value.trim()); } catch {} };
const me = () => $('me').value.trim();

// ---- tabs ----
function tab(name) {
  $('pageMain').hidden = name !== 'main';
  $('pageServer').hidden = name !== 'server';
  $('tabMain').classList.toggle('cur', name === 'main');
  $('tabServer').classList.toggle('cur', name === 'server');
  if (name === 'server') loadServer();
}
$('tabMain').onclick = () => tab('main');
$('tabServer').onclick = () => tab('server');

// ---- bots ----
const JOB = {schematic: 'Baut', produce: 'Produziert', mine: 'Baut ab', chop: 'Fällt Bäume', come: 'Kommt', follow: 'Folgt', guard: 'Hält Wache',
  deposit: 'Lagert ein', withdraw: 'Holt aus Kiste', craft: 'Craftet', smelt: 'Schmilzt', grave: 'Holt sein Grab', rearm: 'Rüstet sich aus',
  tidy: 'Räumt auf', goto: 'Läuft', build: 'Baut', shift: 'Schicht', hunt: 'Jagt', bed: 'Schläft', treefarm: 'Baumfarm', wheatfarm: 'Weizenfarm'};
const PROJECT = new Set(['schematic', 'produce']);
const pct = (a, b) => (b ? Math.max(0, Math.min(100, Math.round((100 * a) / b))) : 0);
const jobText = (j) => {
  if (!j) return 'frei';
  const what = JOB[j.type] || j.type;
  const file = /^(\S+)\.litematic/.exec(j.label || '')?.[1];
  return `${what}${file ? ' ' + file : ''}${j.total ? ` (${j.done}/${j.total})` : j.progress ? ` (${j.progress})` : ''}`;
};
const cards = new Map();
function botCard(b) {
  let c = cards.get(b.name);
  if (c) return c;
  c = {name: el('b'), role: el('span', {class: 'badge'}), state: el('span', {class: 'small'}), hp: el('i'), food: el('i'),
    job: el('div'), jobBar: el('i'), act: el('div', {class: 'mut small'}), pos: el('div', {class: 'mut small'}), inv: el('div', {class: 'chips'}),
    err: el('div', {class: 'err small'}), proj: el('div', {class: 'row'})};
  c.jobBarBox = el('div', {class: 'bar prog'}, c.jobBar);
  const need = (f) => () => (me() ? f(me()) : say('Trag oben deinen Spielernamen ein', true));
  c.root = el('div', {class: 'bot'},
    el('div', {class: 'row between'}, el('div', {class: 'row'}, c.name, c.role), c.state),
    el('div', {class: 'row'}, el('span', {class: 'lbl'}, 'Leben'), el('div', {class: 'bar hp'}, c.hp)),
    el('div', {class: 'row'}, el('span', {class: 'lbl'}, 'Essen'), el('div', {class: 'bar food'}, c.food)),
    el('div', {style: 'margin-top:8px'}, c.job), c.jobBarBox, c.act, c.pos, el('div', {style: 'margin:8px 0'}, c.inv), c.err,
    el('div', {class: 'row', style: 'margin-top:8px'},
      el('button', {class: 'b', onclick: need((p) => job([b.name], 'come', {player: p}))}, 'Komm'),
      el('button', {class: 'b', onclick: need((p) => job([b.name], 'follow', {player: p}))}, 'Folge'),
      el('button', {class: 'b', onclick: need((p) => job([b.name], 'guard', {player: p, radius: 16}))}, 'Wache'),
      el('button', {class: 'b stop', onclick: () => job([b.name], 'stop')}, 'Stopp')),
    c.proj);
  cards.set(b.name, c);
  $('bots').append(c.root);
  return c;
}
function renderBots(m) {
  for (const b of m.bots) {
    const c = botCard(b);
    c.name.textContent = b.name;
    c.role.textContent = b.role || '';
    c.role.hidden = !b.role;
    c.state.textContent = !b.online ? 'offline' : b.dead ? 'tot' : b.combat ? 'kämpft' : '';
    c.state.className = 'small ' + (!b.online || b.dead ? 'err' : 'mut');
    c.hp.style.width = pct(b.health || 0, 20) + '%';
    c.food.style.width = pct(b.food || 0, 20) + '%';
    c.job.textContent = jobText(b.job) + (b.queue?.length ? ` · danach: ${b.queue.length}` : '');
    c.jobBarBox.hidden = !b.job?.total;
    c.jobBar.style.width = pct(b.job?.done, b.job?.total) + '%';
    c.act.textContent = b.activity || '';
    c.pos.textContent = b.pos ? `${b.pos.join(' ')} · ${b.dimension || ''}` : '';
    const inv = (b.inventory || []).map((s) => /^(\S+) x(\d+)$/.exec(s)).filter(Boolean).map((m2) => [m2[1], +m2[2]])
      .filter(([n]) => !/_(pickaxe|axe|shovel|sword|hoe)$/.test(n)).sort((a, z) => z[1] - a[1]).slice(0, 8);
    c.inv.replaceChildren(...inv.map(([n, k]) => el('span', {class: 'chip'}, `${k} ${n.replace(/_/g, ' ')}`)));
    c.err.textContent = b.lastError && b.lastErrorAgoS != null && b.lastErrorAgoS < 900 ? b.lastError.slice(0, 160) : '';
    // A project this bot works on (or paused): pause it, or take it up again.
    const st = (m.projects || {})[b.name], running = b.job && PROJECT.has(b.job.type);
    const act = (action, okText) => () => post('/api/project', {bot: b.name, action}).then(() => say(okText), (e) => say(e.message, true));
    c.proj.replaceChildren(...(running ? [el('button', {class: 'b', onclick: act('pause', `${b.name}: Projekt pausiert`)}, 'Projekt pausieren')]
      : st && PROJECT.has(st.type) ? [el('button', {class: 'b go', onclick: act('resume', `${b.name}: Projekt geht weiter`)}, 'Projekt fortsetzen')] : []));
  }
}

// ---- project ----
let materials = null;
async function loadMaterials() {
  try { materials = await (await fetch('/api/materials')).json(); } catch { materials = null; }
}
function renderProject(m) {
  const crew = m.bots.filter((b) => b.job && PROJECT.has(b.job.type));
  const paused = Object.entries(m.projects || {}).filter(([, p]) => PROJECT.has(p.type));
  $('project').hidden = !crew.length && !paused.length;
  if ($('project').hidden) return;
  const builders = crew.filter((b) => b.job.type === 'schematic' && b.job.total);
  const lead = builders.sort((a, z) => z.job.done - a.job.done)[0];
  const file = materials?.file || /^(\S+?)\.litematic/.exec((crew[0]?.job.label) || paused[0]?.[1].summary || '')?.[1] || 'Schematic';
  $('projTitle').textContent = `Projekt: ${String(file).replace(/\.litematic$/, '')}`;
  $('projCrew').textContent = crew.length ? crew.map((b) => `${b.name} ${b.job.type === 'produce' ? '(Material)' : '(Bau)'}`).join(', ') : 'pausiert';
  const total = lead?.job.total || materials?.cells || 0, done = lead?.job.done || 0;
  $('projBar').style.width = pct(done, total) + '%';
  $('projNum').textContent = total ? `${done}/${total} · ${pct(done, total)} %` : '';
  const prod = crew.find((b) => b.job.type === 'produce');
  $('projPhase').textContent = [lead && `Bau: ${lead.activity || ''}`, prod && `Material: ${prod.job.progress || prod.activity || ''}`].filter(Boolean).join(' · ');
  const lack = Object.entries(materials?.lacking || {}).sort((a, z) => z[1] - a[1]).slice(0, 14);
  $('projNeedBox').hidden = !lack.length;
  $('projNeed').replaceChildren(...lack.map(([n, k]) => el('span', {class: 'chip need'}, `${k} ${n.replace(/_/g, ' ')}`)));
  const owner = Object.entries(materials?.owner || {});
  $('projOwnerBox').hidden = !owner.length;
  $('projOwner').replaceChildren(...owner.map(([n, k]) => el('span', {class: 'chip owner'}, `${k} ${n.replace(/_/g, ' ')}`)));
  $('projNote').textContent = !materials ? 'Die Materialliste erscheint, sobald ein Bot dieses Rechners am Bauplatz ist.'
    : materials.counted < materials.chests ? `Kisten gezählt: ${materials.counted} von ${materials.chests} (der Rest beim nächsten Besuch).` : '';
}

// ---- events ----
let evLast = 0;
const events = [];
const QUIET = /make room|claim|skipped: another bot|missing material to fill/;
async function loadEvents() {
  try {
    const j = await (await fetch('/api/events?since=' + evLast)).json();
    evLast = j.lastId;
    for (const e of j.events) if (e.kind !== 'claim' && !QUIET.test(e.text)) events.push(e);
    events.splice(0, Math.max(0, events.length - 40));
    $('events').replaceChildren(...events.slice().reverse().map((e) => el('div', {class: 'ev ' + e.kind},
      el('span', {class: 'mut'}, new Date(e.t).toLocaleTimeString('de-DE', {hour: '2-digit', minute: '2-digit'})),
      el('b', {}, e.bot), el('span', {}, e.text))));
  } catch {}
}

// ---- live state ----
let last = null;
function connect() {
  const ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');
  ws.onopen = () => $('conn').classList.add('on');
  ws.onmessage = (e) => {
    last = JSON.parse(e.data);
    renderBots(last);
    renderProject(last);
    if (last.lastEventId !== evLast) loadEvents();
  };
  ws.onclose = () => { $('conn').classList.remove('on'); setTimeout(connect, 2000); };
}
$('stopAll').onclick = () => last && confirm('Alle Bots stoppen?') && job(last.bots.map((b) => b.name), 'stop');

// ---- server ----
let conLast = 0, conTimer = null;
async function loadServer() {
  try {
    const r = await fetch('/api/admin/status');
    const s = await r.json();
    if (!r.ok) throw new Error(s.error || `HTTP ${r.status}`);
    $('srvStatus').textContent = `${s.players.length} online${s.tps?.length ? ` · TPS ${s.tps.join(' / ')}` : ''}${s.restartAt ? ' · Neustart geplant' : ''}`;
    $('players').replaceChildren(...s.players.map((p) => el('span', {class: 'chip'}, p.name + (p.bot ? ' (Bot)' : ''))));
  } catch (e) { $('srvStatus').textContent = 'Server-Status nicht erreichbar: ' + e.message; }
  clearInterval(conTimer);
  conTimer = setInterval(() => ($('pageServer').hidden ? clearInterval(conTimer) : loadConsole()), 2000);
  loadConsole();
}
async function loadConsole() {
  try {
    const j = await (await fetch('/api/admin/console?since=' + conLast)).json();
    conLast = j.lastId;
    const box = $('console');
    for (const e of j.entries || []) box.append(el('div', {}, `${e.cmd ? '> ' + e.cmd + '\n' : ''}${e.reply ?? e.text ?? ''}`));
    box.scrollTop = box.scrollHeight;
  } catch {}
}
$('refresh').onclick = loadServer;
for (const b of document.querySelectorAll('[data-act]')) {
  b.onclick = () => post('/api/admin/action', {action: b.dataset.act, value: b.dataset.value}).then(() => { say('erledigt: ' + b.textContent); loadConsole(); }, (e) => say(e.message, true));
}
$('cmdForm').onsubmit = (e) => {
  e.preventDefault();
  const cmd = $('cmd').value.trim();
  if (!cmd) return;
  post('/api/admin/action', {action: 'command', cmd}).then(() => { $('cmd').value = ''; loadConsole(); }, (err) => say(err.message, true));
};

connect();
loadEvents();
loadMaterials();
setInterval(loadMaterials, 15000);
</script>
</body>
</html>
